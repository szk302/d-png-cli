name: CI

on:
  push:
    # Only main: branches with a pull request are checked by pull_request, so
    # running on every branch push would run CI twice. Release tags run these
    # checks from release.yml instead.
    branches: [main]
  pull_request:
  # Run manually for branches without a pull request.
  workflow_dispatch:
  workflow_call:

# Cancel superseded runs for the same pull request. Every other run gets a
# group of its own, so main runs are never queued or cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Install license tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2,cargo-deny@0.20.2
      - run: cargo fetch --locked
      - run: cargo deny --locked check licenses
      - name: Verify generated dependency notices
        run: python scripts/cargo_licenses.py --check

  test:
    needs: licenses
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Verify bundled assets
        run: python scripts/vendor_drawio.py --check
      - name: Test headless Chromium rendering
        if: runner.os == 'Linux'
        env:
          D_PNG_TEST_CHROME_ARGS: --no-sandbox --disable-dev-shm-usage
        run: |
          D_PNG_TEST_CHROME_PATH="$(command -v google-chrome)" cargo test --locked --test chromium -- --ignored --nocapture
      - run: cargo build --release --locked
      - name: Package binary with license notices
        shell: bash
        run: |
          binary=target/release/d-png-cli
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python scripts/package_binary.py "$binary" "target/d-png-cli-$RUNNER_OS-$RUNNER_ARCH.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: d-png-cli-${{ runner.os }}-${{ runner.arch }}
          path: target/d-png-cli-*.tar.gz
          if-no-files-found: error
